function buildCards(units) {
  return units.map(u => {
    const slides = u.photos.map(p => `<div class="gallery-slide" style="background-image:url('${p}')"></div>`).join('');
    const dots = u.photos.map((_, i) => `<span class="gallery-dot${i===0?' active':''}" data-idx="${i}"></span>`).join('');
    const tags = u.tags.map(t => `<span class="feature-tag">${t}</span>`).join('');
    return `
      <div class="unit-card" data-filter="${u.filter}" data-unit="${u.num}">
        <div class="unit-gallery">
          <div class="gallery-slides" data-current="0">${slides}</div>
          <button class="gallery-prev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button class="gallery-next"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
          <div class="gallery-dots">${dots}</div>
          <div class="unit-badge">${u.badge}</div>
        </div>
        <div class="unit-body">
          <p class="unit-type">${u.type}</p>
          <h3 class="unit-name">${u.name}</h3>
          <p class="unit-desc">${u.desc}</p>
          <div class="unit-features">${tags}</div>
          <div class="unit-footer">
            <div class="unit-price">${u.price} <span>/ night</span></div>
            <a href="booking.html" class="btn-book">Book Now</a>
          </div>
        </div>
      </div>`;
  }).join('');
}

const grid = document.getElementById('units-grid');
grid.innerHTML = buildCards(UNITS);

function goToSlide(gallery, idx) {
  const slides = gallery.querySelector('.gallery-slides');
  const dots = gallery.querySelectorAll('.gallery-dot');
  const total = dots.length;
  idx = (idx + total) % total;
  slides.style.transform = `translateX(-${idx * 100}%)`;
  slides.dataset.current = idx;
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
}

grid.addEventListener('click', e => {
  const gallery = e.target.closest('.unit-gallery');
  if (!gallery) return;
  const slides = gallery.querySelector('.gallery-slides');
  const current = parseInt(slides.dataset.current || 0);
  if (e.target.closest('.gallery-next')) goToSlide(gallery, current + 1);
  if (e.target.closest('.gallery-prev')) goToSlide(gallery, current - 1);
  if (e.target.closest('.gallery-dot')) goToSlide(gallery, parseInt(e.target.dataset.idx));
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    const filter = this.dataset.filter;
    const cards = document.querySelectorAll('.unit-card');
    let visible = 0;
    cards.forEach(card => {
      const show = filter === 'all' || card.dataset.filter.includes(filter);
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    document.getElementById('units-count').textContent =
      filter === 'all' ? `Showing all ${visible} units` : `Showing ${visible} unit${visible!==1?'s':''}`;
  });
});
